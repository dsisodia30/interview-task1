<div class="card mb-4">
  <div class="card-header">
    Filters
  </div>
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="row g-3">
      <div class="col-md-3">
        <label for="restaurantId" class="form-label">Restaurant ID</label>
        <input
          type="number"
          id="restaurantId"
          formControlName="restaurantId"
          class="form-control"
          placeholder="Enter restaurant ID"
        />
      </div>
      <div class="col-md-3">
        <label for="startDate" class="form-label">Start Date</label>
        <input
          type="date"
          id="startDate"
          formControlName="startDate"
          class="form-control"
        />
      </div>
      <div class="col-md-3">
        <label for="endDate" class="form-label">End Date</label>
        <input
          type="date"
          id="endDate"
          formControlName="endDate"
          class="form-control"
        />
      </div>
      <div class="col-md-3 d-flex align-items-end">
        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="!form.valid"
        >
          Load Statistics
        </button>
      </div>
    </form>
  </div>
</div>
